name: Codex issue handoff

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to hand off (leave empty to notify about all codex-ready issues)"
        required: false
        type: string

concurrency:
  group: codex-issue-handoff
  cancel-in-progress: false

jobs:
  notify-local-codex:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'codex-ready') &&
      github.repository == 'nguyentrunghieutcu/ctxora-engine'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify that local Codex owns execution
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          issue_number="${INPUT_ISSUE_NUMBER:-}"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "Local Scheduled Codex will pick up this issue from the local checkout. Add the codex-approved label when it is ready to run. GitHub Actions does not execute Codex or require an OPENAI_API_KEY."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "labeled" ]; then
            gh issue comment "$EVENT_ISSUE_NUMBER" --body "Local Scheduled Codex will pick up this issue from the local checkout. Add the codex-approved label when it is ready to run. GitHub Actions does not execute Codex or require an OPENAI_API_KEY."
            exit 0
          fi
          gh issue list --state open --label codex-ready --limit 20 --json number --jq '.[].number' | while read -r issue_number; do
            gh issue comment "$issue_number" --body "Local Scheduled Codex is monitoring this issue. Add the codex-approved label when it is ready to run."
          done
